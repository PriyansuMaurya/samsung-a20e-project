<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-label="Stylised portrait illustration of Priyanshu Maurya">
  <title>Priyanshu Maurya</title>
  <defs>
    <pattern id="dither" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.9" fill="#5d6b78"/>
      <circle cx="4.2" cy="4.2" r="0.9" fill="#5d6b78"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ebef"/>
      <stop offset="1" stop-color="#c3ccd4"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="300" height="360"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="300" height="360" fill="url(#bg)"/>
    <rect width="300" height="360" fill="url(#dither)" opacity="0.45"/>

    <!-- shoulders and jacket -->
    <path d="M8 360c8-62 52-98 112-110l30-6 30 6c60 12 104 48 112 110z" fill="#39536b"/>
    <path d="M112 258c14 22 24 34 38 46 14-12 24-24 38-46l-14-6-24 22-24-22z" fill="#e9eef2"/>
    <path d="M150 304v56" stroke="#2b3f52" stroke-width="3"/>

    <!-- neck -->
    <path d="M127 205h46v42c0 12-10 20-23 20s-23-8-23-20z" fill="#c08f66"/>
    <path d="M127 205h46v14c-14 8-32 8-46 0z" fill="#a97a54" opacity="0.7"/>

    <!-- ears -->
    <ellipse cx="88" cy="160" rx="10" ry="16" fill="#c99a70"/>
    <ellipse cx="212" cy="160" rx="10" ry="16" fill="#c99a70"/>

    <!-- head -->
    <ellipse cx="150" cy="150" rx="62" ry="76" fill="#d8a87d"/>
    <path d="M150 226c-26 0-44-14-52-32 10 26 28 40 52 40s42-14 52-40c-8 18-26 32-52 32z" fill="#c3916a" opacity="0.55"/>

    <!-- hair -->
    <path d="M86 150c-6-58 16-98 64-100s70 42 64 100c-2-26-6-44-16-54-22 8-58 10-84 2-16 10-26 26-28 52z" fill="#241a15"/>
    <path d="M86 150c-4-22 0-38 8-50 4 18 6 34 4 50zM214 150c4-22 0-38-8-50-4 18-6 34-4 50z" fill="#241a15"/>

    <!-- brows -->
    <path d="M111 124c11-6 26-7 36-2" stroke="#241a15" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M153 122c10-5 25-4 36 2" stroke="#241a15" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- eyes -->
    <ellipse cx="127" cy="150" rx="5" ry="5.5" fill="#241a15"/>
    <ellipse cx="173" cy="150" rx="5" ry="5.5" fill="#241a15"/>

    <!-- glasses -->
    <g fill="none" stroke="#20242a" stroke-width="4">
      <rect x="103" y="134" width="46" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="151" y="134" width="46" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <path d="M149 150h2M103 148l-15 4M197 148l15 4"/>
    </g>

    <!-- nose and mouth -->
    <path d="M151 154l-5 26c2 4 8 6 13 4" stroke="#a4714d" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M134 199c9 7 23 7 32 0" stroke="#7c4534" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M142 210c5 3 11 3 16 0" stroke="#b78463" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- scan lines, for that freshly-scanned look -->
    <rect width="300" height="360" fill="none" stroke="#aab6c0" stroke-width="2"/>
  </g>
</svg>
